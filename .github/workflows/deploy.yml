name: PHP CI/CD to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source artifact
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/source"
          tar -cf "$RUNNER_TEMP/source.tar" \
            -C "$RUNNER_TEMP/source" \
            --exclude='./.github/modernize' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.azcode-runtime.php' \
            --exclude='./assets/storage' \
            --exclude='./cron/LogBank.txt' \
            --exclude='./cron/*.lock' \
            --exclude='*.sql' \
            --exclude='error_log' \
            --exclude='*/error_log' \
            --exclude='.DS_Store' \
            .
          tar -rf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/source" assets/storage/images/products
          gzip -n "$RUNNER_TEMP/source.tar"
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ runner.temp }}/source.tar.gz
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate PHP
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Extract source
        run: |
          mkdir app
          tar -xzf source/source.tar.gz -C app
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, gd, mbstring, mysqli
          coverage: none
      - name: Check PHP syntax
        working-directory: app
        run: find . -path './vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Validate Composer manifest and lock file
        working-directory: app
        run: composer validate --no-check-publish

  test:
    name: Test application logic
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Extract source
        run: |
          mkdir app
          tar -xzf source/source.tar.gz -C app
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, gd, mbstring, mysqli
          coverage: none
      - name: Run application tests
        working-directory: app
        run: php tests/run.php

  build:
    name: Build deployment package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Extract source
        run: |
          mkdir app
          tar -xzf source/source.tar.gz -C app
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, gd, mbstring, mysqli
          coverage: none
      - name: Install production dependencies
        working-directory: app
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Package application without hosting data
        working-directory: app
        run: |
          tar -cf "$RUNNER_TEMP/site.tar" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.azcode-runtime.php' \
            --exclude='./assets/storage' \
            --exclude='./cron/LogBank.txt' \
            --exclude='./cron/*.lock' \
            --exclude='*.sql' \
            --exclude='error_log' \
            --exclude='*/error_log' \
            --exclude='.DS_Store' \
            .
          tar -rf "$RUNNER_TEMP/site.tar" assets/storage/images/products
          gzip -n "$RUNNER_TEMP/site.tar"
          tar -tzf "$RUNNER_TEMP/site.tar.gz" > "$RUNNER_TEMP/site-files.txt"
          if ! grep -Fxq './config/config.php' "$RUNNER_TEMP/site-files.txt"; then
            echo "::error::Missing config/config.php in deployment package."
            exit 1
          fi
          if grep -Eq '(^|/)(\.env(\.[^/]*)?|\.azcode-runtime\.php|cron/LogBank\.txt|.*\.sql)$' "$RUNNER_TEMP/site-files.txt"; then
            echo "::error::Protected configuration or database files were included in the deployment package."
            exit 1
          fi
          if grep -Ev '(^|/)assets/storage/images/products(/|$)' "$RUNNER_TEMP/site-files.txt" | grep -Eq '(^|/)assets/storage(/|$)'; then
            echo "::error::Hosting storage outside product images was included in the deployment package."
            exit 1
          fi
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: site-package
          path: ${{ runner.temp }}/site.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: site-package
          path: package
      - name: Validate remote Bash scripts
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cpanel-shell-check.sh" <<'REMOTE'
          set -euo pipefail
          deploy_path=$1
          # config.php reads the runtime file from the parent of public_html.
          [[ "$deploy_path" == "$HOME/public_html" ]] || {
            echo 'Expected Document Root: $HOME/public_html' >&2
            exit 1
          }
          mkdir -p -- "$deploy_path"
          [[ "$(cd -- "$deploy_path" && pwd -P)" == "$(cd -- "$HOME" && pwd -P)/public_html" ]]
          test -w "$deploy_path"
          printf '%s\n' 'CPANEL_SHELL_READY'
          REMOTE
          cat > "$RUNNER_TEMP/cpanel-extract.sh" <<'REMOTE'
          set -euo pipefail
          package_path=$1
          deploy_path=$2
          tar -xzf "$package_path" -C "$deploy_path"
          test -f "$deploy_path/index.php"
          test -f "$deploy_path/config/config.php"
          test -s "$HOME/.azcode-runtime.php"
          rm -f -- "$package_path"
          printf '%s\n' 'CPANEL_DEPLOY_OK'
          REMOTE
          bash -n "$RUNNER_TEMP/cpanel-shell-check.sh"
          bash -n "$RUNNER_TEMP/cpanel-extract.sh"
          echo "Remote Bash scripts passed syntax checks."
      - name: Configure SSH identity
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          : "${CPANEL_SSH_HOST:?Add the CPANEL_SSH_HOST secret}"
          : "${CPANEL_SSH_USER:?Add the CPANEL_SSH_USER secret}"
          : "${CPANEL_SSH_PRIVATE_KEY:?Add the CPANEL_SSH_PRIVATE_KEY secret}"
          : "${CPANEL_SSH_KEY_PASSPHRASE:?Add the CPANEL_SSH_KEY_PASSPHRASE secret}"
          : "${CPANEL_SSH_KNOWN_HOSTS:?Add the CPANEL_SSH_KNOWN_HOSTS secret}"
          : "${CPANEL_DEPLOY_PATH:?Add the CPANEL_DEPLOY_PATH secret}"
          : "${SITE_URL:?Add the SITE_URL secret}"
          [[ "$SITE_URL" =~ ^https?:// ]] || { echo "::error::SITE_URL must start with http:// or https://"; exit 1; }
          port="${CPANEL_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "::error::CPANEL_SSH_PORT must be numeric"; exit 1; }
          [[ "$CPANEL_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Invalid CPANEL_SSH_HOST"; exit 1; }
          [[ "$CPANEL_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid CPANEL_SSH_USER"; exit 1; }
          [[ "$CPANEL_DEPLOY_PATH" =~ ^/home/[A-Za-z0-9._/-]+$ && "$CPANEL_DEPLOY_PATH" != *"/../"* && "$CPANEL_DEPLOY_PATH" != */.. ]] || {
            echo "::error::CPANEL_DEPLOY_PATH must be a cPanel path under /home with no parent-directory segments"
            exit 1
          }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/cpanel_deploy"
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cpanel_deploy" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_KEY_PASSPHRASE"
          ASKPASS
          chmod 700 "$HOME/.ssh/askpass"
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          SSH_ASKPASS="$HOME/.ssh/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            timeout 30s ssh-add "$HOME/.ssh/cpanel_deploy" </dev/null
          unset CPANEL_SSH_PRIVATE_KEY CPANEL_SSH_KEY_PASSPHRASE

      - name: Check SSH shell access
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          remote="${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}"
          ssh_options=(-p "$port" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          if ! ssh "${ssh_options[@]}" "$remote" bash -s -- "$CPANEL_DEPLOY_PATH" \
            < "$RUNNER_TEMP/cpanel-shell-check.sh" | tee "$RUNNER_TEMP/cpanel-shell-check.log"; then
            echo "::error::The SSH account could not execute the remote shell check. Ask the hosting provider to enable shell access."
            exit 1
          fi
          if ! grep -Fxq 'CPANEL_SHELL_READY' "$RUNNER_TEMP/cpanel-shell-check.log"; then
            echo "::error::The SSH account did not confirm shell access and write permission for the document root."
            exit 1
          fi
          echo "SSH shell access and document-root write permission confirmed."

      - name: Upload deployment package
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          remote="${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}"
          package_name=".github-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote_package_path="${CPANEL_DEPLOY_PATH%/*}/$package_name"
          scp -P "$port" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            package/site.tar.gz "$remote:$remote_package_path"
          echo "Deployment package uploaded to the configured cPanel account."

      - name: Configure production database runtime
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DB_HOST:?Add the DB_HOST secret}"
          : "${DB_NAME:?Add the DB_NAME secret}"
          : "${DB_USER:?Add the DB_USER secret}"
          : "${DB_PASSWORD:?Add the DB_PASSWORD secret}"
          : "${SITE_URL:?Add the SITE_URL secret}"
          umask 077
          runtime_file="$(mktemp "$RUNNER_TEMP/azcode-runtime.XXXXXX")"
          trap 'rm -f -- "$runtime_file"' EXIT
          # Encode only for safe PHP syntax; base64 is not encryption.
          python3 - "$runtime_file" <<'PYTHON'
          import base64, json, os, sys
          config = {key: os.environ[key] for key in (
              'DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASSWORD'
          )}
          config['DB_PORT'] = '3306'
          config['APP_URL'] = os.environ['SITE_URL']
          payload = base64.b64encode(json.dumps(config).encode('utf-8')).decode('ascii')
          with open(sys.argv[1], 'w', encoding='utf-8') as f:
              f.write("<?php\nreturn json_decode(base64_decode('" + payload + "'), true, 512, JSON_THROW_ON_ERROR);\n")
          PYTHON
          unset DB_HOST DB_NAME DB_USER DB_PASSWORD
          port="${CPANEL_SSH_PORT:-22}"
          remote="${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}"
          ssh_options=(-p "$port" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          remote_script="$(cat <<'REMOTE'
          set -eu
          umask 077
          tmp=$(mktemp "$HOME/.azcode-runtime.XXXXXX")
          trap 'rm -f -- "$tmp"' EXIT
          cat > "$tmp"
          test -s "$tmp"
          chmod 600 "$tmp"
          mv -fT -- "$tmp" "$HOME/.azcode-runtime.php"
          printf '%s\n' 'CPANEL_RUNTIME_READY'
          REMOTE
          )"
          bash -n <<< "$remote_script"
          result="$(ssh "${ssh_options[@]}" "$remote" "$remote_script" < "$runtime_file")"
          if ! grep -Fxq 'CPANEL_RUNTIME_READY' <<< "$result"; then
            echo "::error::The remote account did not confirm runtime configuration."
            exit 1
          fi
          echo "Production runtime configuration installed outside public_html."

      - name: Extract and verify deployment
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          remote="${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}"
          package_name=".github-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote_package_path="${CPANEL_DEPLOY_PATH%/*}/$package_name"
          ssh_options=(-p "$port" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          if ! ssh "${ssh_options[@]}" "$remote" bash -s -- "$remote_package_path" "$CPANEL_DEPLOY_PATH" \
            < "$RUNNER_TEMP/cpanel-extract.sh" | tee "$RUNNER_TEMP/cpanel-extract.log"; then
            echo "::error::Remote extraction or index.php verification failed."
            exit 1
          fi
          if ! grep -Fxq 'CPANEL_DEPLOY_OK' "$RUNNER_TEMP/cpanel-extract.log"; then
            echo "::error::The remote command did not confirm extraction of index.php into the configured document root."
            exit 1
          fi
          echo "Deployment files extracted and index.php verified."

      - name: Stop SSH agent
        if: always()
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null
          fi
          rm -f -- "$HOME/.ssh/cpanel_deploy" "$HOME/.ssh/askpass"

  verify:
    name: Verify live website
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check website response
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          : "${SITE_URL:?Add the SITE_URL secret}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors --output "$response_file" --write-out '%{http_code}' "$SITE_URL")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Website health check returned HTTP $status for SITE_URL."
            exit 1
          fi
          if grep -Eiq 'Index of /|Chưa kết nối đến DATABASE|Fatal error|Uncaught Error' "$response_file"; then
            echo "::error::The website returned a directory listing or PHP/database error instead of the application."
            exit 1
          fi
          echo "Website health check passed with HTTP $status."
